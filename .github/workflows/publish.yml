name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*' # Триггер на теги вида v1.0.0

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          
      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack --configuration Release --no-restore -p:Version=${GITHUB_REF#refs/tags/v}

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: Lonefor
        
      - name: Publish
        run: dotnet nuget push bin/Release/ErrorsFlow.${GITHUB_REF#refs/tags/v}.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
